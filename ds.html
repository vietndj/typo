    <style>
        /* MATERIAL DESIGN V3 DARK THEME */
        :root { --md-sys-color-background: #141218; --md-sys-color-surface: #211F26; --md-sys-color-primary: #00F0FF; --md-sys-color-on-primary: #000; --md-sys-color-outline: #938F99; --md-elevation: 0 4px 6px -1px rgba(0,0,0,0.2); }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--md-sys-color-background); color: #E6E1E5; margin: 0; padding: 40px 20px 100px; line-height: 1.5; }
        .md-container { max-width: 650px; margin: 0 auto; }
        h1 { font-weight: 300; letter-spacing: 1px; color: #fff; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; margin-bottom: 30px; }
        
        /* CARD COMPONENT */
        .md-card { background: var(--md-sys-color-surface); border-radius: 16px; padding: 30px; margin-bottom: 24px; box-shadow: var(--md-elevation); border: 1px solid rgba(255,255,255,0.05); }
        .md-card-title { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1.5px; margin: 0 0 24px 0; color: var(--md-sys-color-primary); font-weight: 600; display: flex; align-items: center; gap: 10px; }
        
        /* OUTLINED TEXT FIELD */
        .md-input-group { margin-bottom: 20px; display: flex; flex-direction: column; position: relative; }
        .md-input-group label { font-size: 0.85rem; color: var(--md-sys-color-outline); margin-bottom: 8px; font-weight: 500; }
        .md-input { background: transparent; border: 1px solid var(--md-sys-color-outline); color: #fff; padding: 14px 16px; border-radius: 8px; outline: none; transition: all 0.2s; font-size: 1rem; }
        .md-input:focus { border-color: var(--md-sys-color-primary); box-shadow: 0 0 0 1px var(--md-sys-color-primary); }
        
        /* BOTTOM APP BAR & FAB */
        .md-bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; padding: 20px; background: rgba(33, 31, 38, 0.85); backdrop-filter: blur(12px); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: center; z-index: 100; }
        .md-fab { background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); border: none; padding: 16px 40px; border-radius: 100px; font-weight: bold; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 240, 255, 0.3); transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .md-fab:hover { filter: brightness(1.15); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0, 240, 255, 0.4); }
        .md-fab:active { transform: translateY(0); }
    </style>
</head>
<body>
    <div class="md-container">
        <h1>⚙️ CMS Design Tokens</h1>

        <div class="md-card">
            <h2 class="md-card-title">✒️ Typography Config</h2>
            <div class="md-input-group">
                <label>Heading Font (Noe Display)</label>
                <input type="text" class="md-input" value="SVN-NoeDisplay-Bold.ttf">
            </div>
            <div class="md-input-group">
                <label>Body Font (Aeonik)</label>
                <input type="text" class="md-input" value="SVN-AEONIK-REGULAR.TTF">
            </div>
        </div>

        <div class="md-card">
            <h2 class="md-card-title">🎨 Color Palette</h2>
            <div class="md-input-group">
                <label>Primary Brand (Neon Cyan)</label>
                <input type="color" class="md-input" value="#00F0FF" style="height: 50px; cursor: pointer;">
            </div>
            <div class="md-input-group">
                <label>Accent (Glow Orange)</label>
                <input type="color" class="md-input" value="#FF5A00" style="height: 50px; cursor: pointer;">
            </div>
        </div>

        <div class="md-card">
            <h2 class="md-card-title">🔌 API Credentials</h2>
            <div class="md-input-group">
                <label>GitHub Repository (User/Repo)</label>
                <input type="text" id="repo-input" class="md-input" placeholder="vietndj/typo">
            </div>
            <div class="md-input-group">
                <label>Personal Access Token (PAT)</label>
                <input type="password" id="pat-input" class="md-input" placeholder="ghp_xxxxxxxxxxxx">
            </div>
        </div>
    </div>

    <div class="md-bottom-bar">
        <button id="save-btn" class="md-fab">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            <span id="btn-text">LƯU & ĐĂNG NHẬP</span>
        </button>
    </div>

    <script>
        // Tự động điền nếu đã có dữ liệu từ trước
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('cms_repo')) document.getElementById('repo-input').value = localStorage.getItem('cms_repo');
            if(localStorage.getItem('cms_pat')) document.getElementById('pat-input').value = localStorage.getItem('cms_pat');
        });

        // Xử lý sự kiện Lưu Token & Chuyển trang
        document.getElementById('save-btn').addEventListener('click', () => {
            const repo = document.getElementById('repo-input').value.trim();
            const pat = document.getElementById('pat-input').value.trim();
            
            if(!pat) {
                alert('Vui lòng nhập Personal Access Token (PAT) để tiếp tục!');
                document.getElementById('pat-input').focus();
                return;
            }

            // Lưu vào LocalStorage
            localStorage.setItem('cms_repo', repo);
            localStorage.setItem('cms_pat', pat);

            // Hiệu ứng UX chuyển đổi trạng thái nút
            const btn = document.getElementById('save-btn');
            btn.style.backgroundColor = '#00E676'; // Xanh lá cây báo thành công
            btn.style.color = '#000';
            btn.style.boxShadow = '0 4px 15px rgba(0, 230, 118, 0.4)';
            document.getElementById('btn-text').innerText = 'ĐÃ LƯU - ĐANG CHUYỂN TRANG...';

            // Delay 800ms để user cảm nhận được phản hồi hệ thống rồi mới sang index
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 800);
        });
    </script>
</body>
</html>
